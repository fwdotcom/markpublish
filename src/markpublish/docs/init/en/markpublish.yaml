# markpublish.yaml
#
# Central configuration file for your document.
# All relative paths resolve from this directory.
# Full reference: markpublish cheatsheet

document:
  # Title, subtitle, and summary for cover page and document metadata
  title: "{title}"
  subtitle: "Your new markpublish project"
  summary: "A project with two sample chapters demonstrating structure, formatting, and typography."

  # "auto" uses the build date (or set a fixed ISO date: "2026-09-22")
  date: "auto"

  # Sets hyphenation and UI labels ("en", "de")
  language: "en"

  # Generate cover page (false starts directly with body content)
  cover: true

  # Optional metadata for cover and headers:
  # author: "Your Name"
  # version: "1.0.0"

  # Layout and typography switches:
  # document_toc: "full"         # Table of contents: "none", "full", or depth integer (e.g. 2)
  # header: true                 # Running header with document and chapter titles
  # footer: true                 # Running footer with page numbers and version
  # autonum_pattern: "_|1|.1|+"  # Numbering (skip part, Chapter 1, Section 1.1)

# Selected theme (default: "default")
theme: "default"

# Document structure (two tiers: parts -> chapters)
parts:
  - part: "Main Part"
    chapters:
      - file: "chapter_1.md"
        # "divider" creates a chapter divider page ("page" starts a new page, "none" continues)
        break_before: "divider"
        # Prevents repeating the H1 heading on the page following the divider
        show_title: false

      - file: "chapter_2.md"
        break_before: "divider"
        show_title: false
