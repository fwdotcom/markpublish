# markpublish.yaml
#
# Zentrale Konfigurationsdatei Ihres Dokuments.
# Alle relativen Pfade beziehen sich auf dieses Verzeichnis.
# Vollständige Dokumentation: markpublish cheatsheet

document:
  # Titel, Untertitel und Zusammenfassung für Deckblatt und Metadaten
  title: "{title}"
  subtitle: "Ihr neues markpublish-Projekt"
  summary: "Ein Projekt mit zwei Beispielkapiteln zur Demonstration von Aufbau, Formatierung und Typografie."

  # "auto" setzt das Baudatum ein (alternativ ISO-Datum, z. B. "2026-09-22")
  date: "auto"

  # Steuert Silbentrennung und UI-Beschriftungen ("de", "en")
  language: "de"

  # Deckblatt erzeugen (false beginnt direkt mit dem Inhalt)
  cover: true

  # Optionale Metadaten fürs Deckblatt:
  # author: "Ihr Name"
  # version: "1.0.0"

  # Layout- und Steuerungsschalter:
  # document_toc: "full"         # Inhaltsverzeichnis: "none", "full" oder Tiefe (z. B. 2)
  # header: true                 # Kopfzeile mit Dokumenttitel und Kapitel
  # footer: true                 # Fußzeile mit Seitenzahlen und Version
  # autonum_pattern: "_|1|.1|+"  # Nummerierung (Part überspringen, Kapitel 1, Abschnitte 1.1)

# Verwendetes Theme (Standard: "default")
theme: "default"

# Dokumentstruktur (zweistufig: parts -> chapters)
parts:
  - part: "Hauptteil"
    chapters:
      - file: "kapitel_1.md"
        # "divider" erzeugt ein Kapitel-Trennblatt ("page" beginnt neue Seite, "none" schließt an)
        break_before: "divider"
        # Verhindert, dass die H1-Überschrift nach dem Trennblatt erneut gedruckt wird
        show_title: false

      - file: "kapitel_2.md"
        break_before: "divider"
        show_title: false
