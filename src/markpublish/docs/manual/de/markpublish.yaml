# markpublish.yaml für das offizielle Benutzerhandbuch (Deutsch).

document:
  title: "markpublish Benutzerhandbuch"
  subtitle: "Moderne PDF-Dokumentenerstellung aus Markdown mit Typst"
  summary: "Praxisorientierte Anleitung und vollständige Referenz zur Konfiguration, CLI-Bedienung, Theme-Gestaltung und Dokumentenerstellung mit markpublish."
  author: "Frank Winter"
  status: "Freigegeben"
  copyright: "© 2026 Frank Winter"
  date: "auto"
  version: "2.0.0"
  language: "de"

  cover: true
  document_toc: 2
  chapter_toc: 2
  part_toc: 2

  header: true
  footer: true

parts:
  - title: "Hauptteil"
    break_before: "none"
    document_toc: "none"
    chapters:
      - file: "chapters/01_introduction.md"
        title: "Einleitung"
        summary: "Motivation, Kernfeatures und die Architektur von markpublish."
        break_before: "divider"
        chapter_toc: "none"

      - file: "chapters/02_quickstart.md"
        title: "Installation und Schnellstart"
        summary: "Der direkte Weg von der Installation bis zum ersten fertigen PDF."
        break_before: "divider"

      - file: "chapters/03_cli_reference.md"
        title: "Kommandozeilen-Schnittstelle (CLI)"
        summary: "Detaillierte Befehlsübersicht und vollständige Optionen-Referenz aller Befehle."
        break_before: "divider"

      - file: "chapters/04_configuration_guide.md"
        title: "Projektkonfiguration mit markpublish.yaml"
        summary: "Strukturierung in Document, Parts und Chapters anhand praktischer Beispiele."
        break_before: "divider"

      - file: "chapters/05_template_system.md"
        title: "Templates und Mehrsprachigkeit"
        summary: "Theme-Struktur mit Typst, 3-stufige Auflösungshierarchie und Textkaskade (i18n)."
        break_before: "divider"

      - file: "chapters/06_markdown_features.md"
        title: "Besondere Markdown-Features"
        summary: "Auszeichnung und typografische Darstellung von Hinweisen, Tabellen, Listen und Code."
        break_before: "divider"

  - title: "Anhänge"
    summary: "Vollständige Spezifikations-Tabellen und Hilfestellungen zur Fehlerbehebung."
    break_before: "divider"
    autonum_from_level: 2
    
    chapters:
      - file: "chapters/07_appendix_yaml_spec.md"
        title: "Anhang A: Schema-Referenz markpublish.yaml"
        autonum_prefix: "A."

      - file: "chapters/08_appendix_troubleshooting.md"
        title: "Anhang B: Fehlerbehebung und FAQ"
        autonum_prefix: "B."
