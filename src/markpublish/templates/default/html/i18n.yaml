# =============================================================================
# Ebene 3 der i18n-Kaskade: Texte nur fuer die HTML-Ausgabe dieses Themes.
#
# Ueberschreibt Ebene 2 (default/i18n.yaml) und den Standard, wirkt aber nicht
# auf die PDF-Ausgabe. Am Bildschirm darf es laenger und erklaerender sein --
# es gibt keinen Seitenumbruch, der Platz kostet.
#
#   1. Programm      markpublish/i18n.yaml
#   2. Theme         default/i18n.yaml
#   3. Zielformat    diese Datei                            <-- Sie sind hier
#
# Die Schluessel page und page_of bleiben hier ohne Wirkung: sie stehen in der
# CSS-Fusszeile der Paged-Media-Ausgabe, die es im HTML nicht gibt.
#
# Ansehen, was am Ende gilt:  markpublish labels --target html --overridden
# =============================================================================

