{# Vom HTML-Theme nicht eingebunden - Trennseiten sind ein Druckmittel.
   Der Part-Titel steht am Bildschirm in der Seitenleiste; der Anker
   #part-<slug> zeigt weiterhin auf die <section> in layout.html. #}
<div class="part-divider-container">
  <div class="part-tag">{{ labels.part }}</div>
  <h1 class="part-title">{{ part.title }}</h1>
  {% if part.summary %}
    <div class="part-summary">{{ part.summary }}</div>
  {% endif %}
</div>
