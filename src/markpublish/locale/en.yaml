# Texte der Programmoberflaeche -- Englisch.
#
# Diese Sprache muss vollstaendig sein: sie liegt unter jeder anderen, damit
# eine unfertige Uebersetzung nie eine leere Zeile erzeugt. Ein Test haelt die
# Kataloge Schluessel fuer Schluessel gegeneinander.
#
# Flach, mit gepunkteten Schluesseln. Platzhalter sind benannt ({path}), nie
# nummeriert, und Rich-Markup steht an der Aufrufstelle, nicht hier.

