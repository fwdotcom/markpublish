# --- Befehle ------------------------------------------------------------------
cmd.build.help: "Baut das Dokument nach PDF und/oder HTML gemäß markpublish.yaml."
cmd.init.help: |
  Legt ein minimales markpublish-Projekt an: eine Konfiguration, ein Kapitel.

  Bewusst klein. Das Gerüst soll verschwinden, sobald echter Inhalt da ist,
  und zeigt deshalb nichts, was es nicht zeigen muss -- das Nachschlagewerk
  ist 'markpublish cheatsheet' und bleibt verfügbar, wenn die letzte Datei
  des Gerüsts gelöscht ist.
cmd.cheatsheet.help: |
  Rendert die zweiseitige Kurzreferenz zu markpublish.yaml und Themes.

  Die Quelle liegt im Paket und wird bei Bedarf gerendert. Das Ergebnis passt
  damit immer zur installierten Fassung -- und ein erfolgreicher Lauf ist
  zugleich der Beweis, dass die Rendering-Kette funktioniert. Geschrieben wird
  nur das fertige Dokument; im Projekt landen keine Quellen.
cmd.manual.help: |
  Rendert das vollständige Benutzerhandbuch.

  Wie bei 'cheatsheet' liegt die Quelle im Paket. Das Handbuch beschreibt
  damit die Fassung, die Sie tatsächlich haben, und nicht die, die galt, als
  zuletzt jemand ein PDF gebaut hat. Mit --lang wählen Sie eine Übersetzung.
cmd.templates.help: "Listet alle verfügbaren Themes aus Benutzer-, Projekt- und Paketquellen."
cmd.export_template.help: "Exportiert ein mitgeliefertes Theme ins Projekt, um es anzupassen."
cmd.labels.help: |
  Zeigt die aufgelösten statischen Texte und welche Ebene jeden geliefert hat.

  Kaskade, spätere gewinnen: markpublish/i18n.yaml -> <theme>/i18n.yaml ->
  <theme>/<target>/i18n.yaml -> i18n.yaml neben der markpublish.yaml. Das
  Theme ist das, welches die Auflösung gewählt hat; die Projektebene hat das
  letzte Wort und ist der Ort, an dem ein Dokument seine eigenen Felder
  benennt.

