# =============================================================================
# markpublish - Ebene 1 der i18n-Kaskade: die mitgelieferten Standardtexte.
#
# Diese Datei ist die einzige Ebene, die vollstaendig sein muss: jeder Schluessel
# muss in jeder Sprache vorhanden sein. Die Ebenen 2 und 3 sind reine Overrides.
#
#   1. Programm      diese Datei  (markpublish/i18n.yaml)
#   2. Theme         <templates>/<theme>/i18n.yaml
#   3. Zielformat    <templates>/<theme>/<target>/i18n.yaml
#
# Mehr Ebenen gibt es nicht - ein Dokument kann keine Texte ueberschreiben.
# Wer eigene Texte braucht, legt ein eigenes Theme an.
#
# Aufbau ist auf allen drei Ebenen identisch: Sprachcode, darunter die Texte.
# Der Sonderschluessel "*" gilt fuer jede Sprache und wird vor dem
# sprachspezifischen Block angewendet.
#
# Eine neue Sprache ergaenzen Sie, indem Sie hier einen vollstaendigen Block
# anlegen - alle Schluessel, die auch unter "en" stehen.
# =============================================================================

en:
  # Inhaltsverzeichnis
  toc_title: "Table of Contents"
  toc_sidebar: "Contents"
  chapter_toc_title: "In this chapter"

  # Marken auf den Trennseiten
  chapter: "Chapter"
  part: "Part"

  # Deckblatt-Metadaten
  author: "Author"
  status: "Status"
  version: "Version"
  date: "Date"
  copyright: "Copyright"

  # Laufende Fusszeile: "Page 3 of 24"
  page: "Page"
  page_of: "of"

  # GitHub-Callouts
  alert_note: "Note"
  alert_tip: "Tip"
  alert_important: "Important"
  alert_warning: "Warning"
  alert_caution: "Caution"

de:
  toc_title: "Inhaltsverzeichnis"
  toc_sidebar: "Inhalt"
  chapter_toc_title: "Inhalt dieses Kapitels"

  chapter: "Kapitel"
  part: "Teil"

  author: "Autor"
  status: "Status"
  version: "Version"
  date: "Datum"
  copyright: "Copyright"

  page: "Seite"
  page_of: "von"

  alert_note: "Hinweis"
  alert_tip: "Tipp"
  alert_important: "Wichtig"
  alert_warning: "Warnung"
  alert_caution: "Achtung"
