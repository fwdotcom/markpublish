# =============================================================================
# markpublish - Ebene 1 der i18n-Kaskade: die mitgelieferten Standardtexte.
#
# Diese Datei ist die einzige Ebene, die vollstaendig sein muss: jeder Schluessel
# muss in jeder Sprache vorhanden sein.
#
#   1. Programm      diese Datei  (markpublish/i18n.yaml)
#   2. Theme         <templates>/<theme>/i18n.yaml
#   3. Zielformat    <templates>/<theme>/<target>/i18n.yaml
#   4. Projekt       ./i18n.yaml  (neben der markpublish.yaml)
#
# Die Ebenen 2 bis 4 sind reine Overrides. Ebene 4 gehört dem Projekt:
# sie erlaubt das Überschreiben von Texten und das Lokalisieren eigener freier
# Metadatenfelder.
#
# Der Sonderschluessel "*" gilt fuer jede Sprache und wird vor dem
# sprachspezifischen Block angewendet.
# Eine neue Sprache ergaenzen Sie, indem Sie hier einen vollstaendigen Block
# anlegen - alle Schluessel, die auch unter "en" stehen.
# =============================================================================

en:
  # Inhaltsverzeichnis
  toc_title: "Table of Contents"
  chapter_toc_title: "In this chapter"
  part_toc_title: "In this part"

  # Marken auf den Trennseiten
  chapter: "Chapter"
  part: "Part"
  label_separator: ": "

  # Deckblatt-Metadaten
  author: "Author"
  status: "Status"
  version: "Version"
  date: "Date"
  copyright: "Copyright"

  # Wahrheitswerte in freien Metadatenfeldern: 'reviewed: true' im Dokument
  # wird als Bool durchgereicht, damit hier das Wort steht und nicht "True".
  bool_true: "Yes"
  bool_false: "No"

  # Laufende Fusszeile: "Page 3 of 24"
  page: "Page"
  page_of: "of"

  # GitHub-Callouts
  alert_note: "Note"
  alert_tip: "Tip"
  alert_important: "Important"
  alert_warning: "Warning"
  alert_caution: "Caution"

de:
  toc_title: "Inhaltsverzeichnis"
  chapter_toc_title: "Inhalt dieses Kapitels"
  part_toc_title: "Inhalt dieses Abschnitts"

  chapter: "Kapitel"
  part: "Teil"
  label_separator: ": "

  author: "Autor"
  status: "Status"
  version: "Version"
  date: "Datum"
  copyright: "Copyright"

  bool_true: "Ja"
  bool_false: "Nein"

  page: "Seite"
  page_of: "von"

  alert_note: "Hinweis"
  alert_tip: "Tipp"
  alert_important: "Wichtig"
  alert_warning: "Warnung"
  alert_caution: "Achtung"
