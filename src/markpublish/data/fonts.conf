<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Minimal fontconfig configuration shipped with markpublish.

  Some GTK/Pango runtimes on Windows (darktable, GIMP, Inkscape) ship
  libfontconfig-1.dll without the etc/fonts/fonts.conf it looks for next to
  its own installation directory. Fontconfig then prints

      Fontconfig error: Cannot load default config file: File not found

  on every run and falls back to a built-in configuration that knows no
  aliases - a bare "font-family: monospace" resolves to whatever font happens
  to be scanned first instead of an actual monospace face.

  WINDOWSFONTDIR, WINDOWSUSERFONTDIR and LOCAL_APPDATA_FONTCONFIG_CACHE are
  fontconfig's own Windows tokens; it expands them itself, so this file needs
  no machine-specific paths.
-->
<fontconfig>
  <dir>WINDOWSFONTDIR</dir>
  <dir>WINDOWSUSERFONTDIR</dir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Segoe UI</family>
      <family>Arial</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Georgia</family>
      <family>Times New Roman</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Consolas</family>
      <family>Cascadia Mono</family>
      <family>Courier New</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>cursive</family>
    <prefer>
      <family>Segoe Script</family>
      <family>Comic Sans MS</family>
    </prefer>
  </alias>

  <alias>
    <family>fantasy</family>
    <prefer>
      <family>Impact</family>
      <family>Segoe UI</family>
    </prefer>
  </alias>
</fontconfig>
