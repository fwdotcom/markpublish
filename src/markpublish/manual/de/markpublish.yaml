# markpublish.yaml für das offizielle Benutzerhandbuch

document:
  title: "markpublish Benutzerhandbuch"
  subtitle: "Moderne PDF- und HTML-Dokumentenerstellung aus Markdown"
  summary: "Dieses Handbuch bietet eine praxisorientierte Anleitung und vollständige Referenz zur Konfiguration, Template-Anpassung und Dokumentengenerierung mit markpublish."
  author: "Frank Winter"
  status: "Freigegeben"
  copyright: "© 2026 Frank Winter"
  date: "auto"
  version: "1.0.0"
  language: "de"

  # Statische Texte (Inhaltsverzeichnis-Überschrift, "Kapitel", "Teil",
  # Deckblatt-Beschriftungen, Callout-Titel) werden im Theme definiert, nicht
  # hier. Die Kaskade hat drei Ebenen, jede tiefere überschreibt die vorherige:
  #
  #   1. Programm      markpublish/i18n.yaml
  #   2. Theme         <templates>/<theme>/i18n.yaml
  #   3. Zielformat    <templates>/<theme>/<pdf|html>/i18n.yaml
  #
  # Ein eigenes Theme legen Sie mit  markpublish export-template  an.
  # Prüfen, was am Ende gilt:  markpublish labels --overridden

  # Globale Layout-Schalter
  cover: true
  toc: true
  autonum_type: "decimal"
  header: true
  footer: true

theme: "default"

chapters:
  # Hauptteil 1: Grundlagen
  - file: "chapters/01_introduction.md"
    title: "Einführung & Architektur"
    summary: "Überblick über Zielsetzung, Kernkonzepte und die modulare Verarbeitungs-Pipeline."
    break_before: "divider"
    toc: false

  - file: "chapters/02_quickstart.md"
    title: "Installation & Schnellstart"
    summary: "Schritt-für-Schritt-Anleitung zur Installation und Erstellung des ersten Dokuments."
    break_before: "divider"
    toc: 2

  # Hauptteil 2: Praxis & Konfiguration
  - file: "chapters/03_cli_reference.md"
    title: "Die CLI-Befehle"
    summary: "Alle Befehle im Detail: build, init, cheatsheet, manual, templates, export-template und labels."
    break_before: "divider"
    toc: 2

  - file: "chapters/04_configuration_guide.md"
    title: "Konfigurations-Leitfaden"
    summary: "Deklarative Definition von Dokumentenmetadaten, Kapiteln und Hierarchien."
    break_before: "divider"
    toc: 2
    chapters:
      - file: "chapters/04_1_chapters_and_hierarchy.md"
        title: "Kapitel, Unterkapitel und Parts"
        break_before: "page"

  - file: "chapters/05_template_system.md"
    title: "Das Template- und Design-System"
    summary: "3-stufige Auflösungshierarchie, CSS Paged Media und 2-zeilige Kopf-/Fußzeilen."
    break_before: "divider"
    toc: 2

  - file: "chapters/06_markdown_features.md"
    title: "Markdown-Features & Syntax"
    summary: "Tabellen, Admonitions/Callouts, Pygments Syntax-Highlighting und Tasklisten."
    break_before: "divider"
    toc: false

  # ============================================================
  # OBERSTER BLOCK: ANHÄNGE
  # ============================================================
  - part: "Anhänge"
    summary: "Vollständige Spezifikations-Tabellen, Troubleshooting und Best Practices."
    break_before: "divider"
    autonum: "none"
    toc_depth: 1
    chapters:
      - file: "chapters/07_appendix_yaml_spec.md"
        title: "Anhang A: YAML-Schema-Referenz"

      - file: "chapters/08_appendix_troubleshooting.md"
        title: "Anhang B: Fehlerbehebung & FAQ"

