name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: pip install -e ".[dev]"

      - name: Verify Typst compiler is available
        shell: bash
        run: |
          python - <<'PY'
          import typst
          pdf = typst.compile(b"#let x = 1\nHello Typst")
          assert len(pdf) > 0, "Typst compilation returned empty bytes"
          print("Typst compiler ready.")
          PY

      - name: Run linter (ruff)
        run: ruff check src tests build_manuals.py

      - name: Run tests (pytest)
        run: pytest
