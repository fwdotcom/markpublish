name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango
          # Auf Apple Silicon liegt Homebrew unter /opt/homebrew, und der
          # dynamische Loader durchsucht diesen Pfad nicht von sich aus.
          # WeasyPrint findet libgobject sonst nicht - obwohl es installiert
          # ist. Der Fehler sieht aus wie eine fehlende Abhaengigkeit, ist
          # aber eine fehlende Suchpfad-Angabe.
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      # Windows bringt kein GTK mit, und WeasyPrint braucht die nativen
      # Pango-Bibliotheken.
      #
      # Das Runner-Image liefert MSYS2 bereits unter C:\msys64 aus - ein
      # eigenes setup-msys2 scheitert daran ("already exists, cannot
      # continue"). Nachgezogen wird deshalb nur das fehlende Paket.
      #
      # C:\msys64\mingw64\bin ist einer der Pfade aus GTK_CANDIDATE_PATHS in
      # renderers/pdf.py. Weder PATH noch GTK_PATH werden angefasst: so laeuft
      # nicht bloss WeasyPrint, sondern die Windows-GTK-Erkennung von
      # markpublish wird tatsaechlich durchlaufen - der einzige Codepfad, den
      # kein anderes Betriebssystem beruehrt.
      #
      # -Sy vorweg, weil die Paketdatenbank im Image aelter sein kann als die
      # Spiegelserver; ohne Aktualisierung laeuft der Download ins Leere. Die
      # Verkettung mit && sorgt dafuer, dass ein Fehler im ersten Aufruf den
      # zweiten verhindert - cmd wertet sonst nur die letzte Zeile aus.
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: >
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm &&
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed
          --disable-download-timeout mingw-w64-x86_64-pango

      - name: Install package and dependencies
        run: pip install -e ".[dev]"

      # Ohne diesen Schritt aeussert sich eine fehlende GTK-Laufzeit als elf
      # scheinbar unzusammenhaengende Testfehler. Hier steht stattdessen in
      # einer Zeile, was fehlt - und der Lauf bricht ab, bevor pytest die
      # Ursache unter Folgefehlern begraebt.
      - name: Verify the PDF toolchain is available
        # bash statt der Standard-Shell: derselbe Schritt laeuft auf allen drei
        # Betriebssystemen, und pwsh kennt kein Here-Document.
        shell: bash
        run: |
          python - <<'PY'
          import sys

          from markpublish.renderers.pdf import _load_weasyprint

          html_cls, error = _load_weasyprint()
          if html_cls is None:
              sys.exit(f"GTK/Pango runtime not usable:\n{error}")
          print("WeasyPrint ready.")
          PY

      - name: Run linter (ruff)
        run: ruff check src tests build_manuals.py

      - name: Run tests (pytest)
        run: pytest

