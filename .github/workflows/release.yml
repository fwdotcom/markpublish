name: Release

# Veroeffentlichung auf PyPI ueber Trusted Publishing (OIDC).
#
# PyPI fragt beim Anlegen des Publishers nach genau vier Angaben - Owner,
# Repository, *Dateiname dieses Workflows* und Environment. Der Dateiname ist
# Teil der Vertrauensbeziehung: nur ein Lauf aus dieser Datei bekommt ein
# gueltiges Token. Wird sie umbenannt, muss der Eintrag auf PyPI mit.
#
#   https://pypi.org/manage/account/publishing/
#     PyPI Project Name:  markpublish
#     Owner:              fwdotcom
#     Repository name:    markpublish
#     Workflow name:      release.yml
#     Environment name:   pypi
#
# Ein API-Token wird dadurch nirgends gebraucht - es gibt kein Secret, das
# ablaufen oder verloren gehen koennte.

on:
  release:
    types: [published]

  # Probelauf gegen TestPyPI, ohne ein Release anzulegen. Eine Version laesst
  # sich auf PyPI nicht ersetzen, nur zurueckziehen - der Probelauf ist die
  # einzige Gelegenheit, das Paket vor dem Ernstfall installiert zu sehen.
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Nach dem Bauen auf TestPyPI veroeffentlichen"
        type: boolean
        default: true

# Standardmaessig nur Lesen. Das OIDC-Token wird ausschliesslich in den beiden
# Publish-Jobs angefordert, damit Build und Tests es nicht einmal sehen.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Ein Release ist unwiderruflich, deshalb laeuft die Testsuite noch einmal -
  # auch wenn CI den Commit bereits gesehen hat. Nicht die volle Matrix aus
  # ci.yml, sondern ihre Raender: was auf der aeltesten und der neuesten
  # unterstuetzten Python-Version durchlaeuft, faellt dazwischen selten um.
  # --------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check src tests build_manuals.py

      - name: Run tests (pytest)
        run: pytest

  # --------------------------------------------------------------------------
  # Bauen und pruefen. Das Ergebnis wandert als Artefakt weiter, damit beide
  # Publish-Jobs exakt dieselben Dateien hochladen - ein zweites Build koennte
  # sich unterscheiden.
  # --------------------------------------------------------------------------
  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Der Tag benennt die Version, pyproject.toml enthaelt sie. Laufen die
      # auseinander, erscheint auf PyPI eine Version, die es im Repository
      # nicht gibt - und der Tag zeigt auf Code, der nie veroeffentlicht wurde.
      # Zurueckholen laesst sich das nicht, also hier abbrechen.
      - name: Check that the tag matches project.version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = os.environ["TAG"].removeprefix("v")

          if tag != version:
              sys.exit(
                  f"Tag '{os.environ['TAG']}' und project.version '{version}' "
                  "passen nicht zusammen. Entweder die Version in "
                  "pyproject.toml anheben oder den Tag korrigieren."
              )
          print(f"Tag und Version stimmen ueberein: {version}")
          PY

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      # twine check faengt genau die Fehler, die PyPI erst beim Upload meldet -
      # allen voran ein README, das dort nicht rendert. --strict macht aus der
      # Warnung einen Abbruch, solange er noch folgenlos ist.
      - name: Check metadata and long description
        run: twine check --strict dist/*

      # Die mitgelieferten Dokumente sind package-data. Fehlen sie im Wheel,
      # laeuft alles - bis jemand 'markpublish manual' aufruft und eine
      # unvollstaendige Installation gemeldet bekommt.
      - name: Verify the bundled documents are in the wheel
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import zipfile

          wheel = next(iter(pathlib.Path("dist").glob("*.whl")), None)
          if wheel is None:
              sys.exit("Kein Wheel in dist/ gefunden.")

          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "markpublish/docs/manual/de/markpublish.yaml",
              "markpublish/docs/manual/en/markpublish.yaml",
              "markpublish/docs/cheatsheet/de/markpublish.yaml",
              "markpublish/docs/cheatsheet/en/markpublish.yaml",
              "markpublish/templates/default/pdf/template.typ",
              "markpublish/i18n.yaml",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit("Im Wheel fehlen:\n  " + "\n  ".join(missing))

          print(f"{wheel.name}: alle mitgelieferten Dateien vorhanden.")
          PY

      # twine check liest die Metadaten, prueft aber nicht, ob etwas darin
      # steht. Eine [project.urls]-Tabelle an der falschen Stelle schluckt in
      # TOML alle nachfolgenden Schluessel - dependencies, requires-python und
      # classifiers landen dann darin, und heraus kommt ein formal gueltiges
      # Paket, das seine Abhaengigkeiten nicht mitinstalliert. Auffallen wuerde
      # das erst dem ersten Nutzer.
      - name: Verify the metadata is complete
        run: |
          python - <<'PY'
          import email
          import pathlib
          import sys
          import zipfile

          wheel = next(iter(pathlib.Path("dist").glob("*.whl")))
          archive = zipfile.ZipFile(wheel)
          name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
          meta = email.message_from_bytes(archive.read(name))

          problems = []
          if not meta.get_all("Requires-Dist"):
              problems.append("Requires-Dist fehlt - das Paket erklaert keine Abhaengigkeiten")
          if not meta.get("Requires-Python"):
              problems.append("Requires-Python fehlt")
          if not meta.get_all("Classifier"):
              problems.append("Classifier fehlen")
          if not meta.get("Project-URL"):
              problems.append("Project-URL fehlt")

          if problems:
              sys.exit(
                  "Unvollstaendige Paket-Metadaten:"
                  + "".join("\n  " + problem for problem in problems)
                  + "\n\nHaeufigste Ursache: eine Tabellen-Ueberschrift wie "
                  "[project.urls] steht mitten in [project] und vereinnahmt "
                  "alles, was danach folgt."
              )

          print(
              f"{len(meta.get_all('Requires-Dist'))} Abhaengigkeiten, "
              f"{len(meta.get_all('Classifier'))} Classifier, "
              f"Python {meta['Requires-Python']}."
          )
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Probelauf. TestPyPI verlangt einen eigenen Trusted Publisher, angelegt
  # unter https://test.pypi.org/manage/account/publishing/ mit denselben
  # Angaben, aber Environment 'testpypi'.
  # --------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/markpublish

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Dieselbe Version laesst sich auf TestPyPI nicht zweimal hochladen.
          # Ein Probelauf ohne Versionssprung soll daran aber nicht scheitern.
          skip-existing: true

  # --------------------------------------------------------------------------
  # Der Ernstfall. Nur aus einem veroeffentlichten GitHub-Release, nie aus
  # einem Push - und ueber das Environment 'pypi', in dem sich bei Bedarf eine
  # Freigabe durch eine Person erzwingen laesst
  # (Settings > Environments > pypi > Required reviewers).
  # --------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/markpublish

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
