[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markpublish"
version = "1.0.0"
description = "Modern, modular, and extensible Markdown-to-PDF/HTML publishing tool powered by WeasyPrint"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Frank Winter", email = "studio@frankwinter.com" }
]
keywords = ["markdown", "pdf", "html", "weasyprint", "publishing", "converter", "cli"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Printing",
]


requires-python = ">=3.10"
dependencies = [
    "weasyprint>=60.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "pymdown-extensions>=10.0",
    "pygments>=2.15.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "platformdirs>=3.0.0",
    "python-frontmatter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Textextraktion aus erzeugten PDFs - die Regressionstests fuer Kopfzeile
    # und TOC-Seitenzahlen pruefen den Inhalt, nicht nur die Dateigroesse.
    "pypdfium2>=4.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/fwdotcom/markpublish"
Documentation = "https://github.com/fwdotcom/markpublish#readme"
Repository = "https://github.com/fwdotcom/markpublish.git"
Issues = "https://github.com/fwdotcom/markpublish/issues"
Changelog = "https://github.com/fwdotcom/markpublish/blob/main/CHANGELOG.md"

[project.scripts]
markpublish = "markpublish.cli:app"
mpub = "markpublish.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"markpublish" = [
    "templates/**/*",
    "docs/**/*",
    "data/*.conf",
    "i18n.yaml",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# F821 haette den fehlenden Union-Import in resolver.py sofort gemeldet -
# `from __future__ import annotations` verdeckt ihn zur Laufzeit.
# UP* ist bewusst nicht aktiv: die Regeln wuerden den gesamten Typing-Stil
# umschreiben, was mit der Fehlersuche nichts zu tun hat.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/Argument() im Default-Wert ist das vorgesehene Typer-Idiom.
"src/markpublish/cli.py" = ["B008"]
"tests/*" = ["B011"]
