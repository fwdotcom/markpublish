[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markpublish"
version = "0.1.0"
description = "Modern, modular, and extensible Markdown-to-PDF/HTML publishing tool powered by WeasyPrint"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "markpublish contributors" }
]
keywords = ["markdown", "pdf", "html", "weasyprint", "publishing", "converter", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Printing",
]
requires-python = ">=3.10"
dependencies = [
    "weasyprint>=60.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "pymdown-extensions>=10.0",
    "pygments>=2.15.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "platformdirs>=3.0.0",
    "python-frontmatter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
markpublish = "markpublish.cli:app"
mpub = "markpublish.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"markpublish" = [
    "templates/**/*",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

